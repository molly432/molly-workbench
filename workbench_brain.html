  function switchTab(tab) {
    S.tab = tab;
    var titles = { lib: ['录音流', '来自得到大脑的录音纪要 · 云端直连，每日 12:00 / 18:00 自动同步'], pool: ['待办仓库', '从录音里提取的行动项，领取后进入当天计划'], flow: ['规则与同步', '提取规则、数据流向与同步方式'] };
    var t = titles[tab] || titles.lib;
    var h = g('pageTitle'), sub = g('pageSub');
    if (h) h.textContent = t[0];
    if (sub) sub.textContent = t[1];
    ['lib', 'pool', 'flow'].forEach(function (k) {
      var p = g('pane-' + k);
      if (p) p.className = 'pane' + (k === tab ? '' : ' hide');
    });
    document.querySelectorAll('#nav button,#tabbar button').forEach(function (b) {
      if (b.getAttribute('data-tab') === tab) b.classList.add('on');
      else b.classList.remove('on');
    });
    if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
  }

  function openMask(id) { var m = g(id); if (m) m.classList.add('on'); }
  function closeMask(id) { var m = g(id); if (m) m.classList.remove('on'); }

  function showText(title, body, note) {
    g('textTitle').textContent = title;
    g('textBody').textContent = body;
    g('textNote').textContent = note || '';
    openMask('textMask');

    document.querySelectorAll('#nav button,#tabbar button').forEach(function (b) {

    document.querySelectorAll('[data-close]').forEach(function (b) {
      b.addEventListener('click', function () { closeMask(b.getAttribute('data-close')); });
    });
    document.querySelectorAll('.mask').forEach(function (m) {
      m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('on'); });

    g('btnReload').addEventListener('click', function () { reload(); toast('已重新同步'); });

      pool: poolAll(),
      lib: libAll().map(function (r) {
        return { 标题: r['标题'], 录音日期: dayKey(r['录音日期']), 来源ID: r['来源ID'], 主题: r['主题'], 待办数: r['待办数'] };
      })
    };
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '得到大脑_录音与待办_备份_' + todayKey() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      toast('备份已下载');
    } catch (e) { toast('导出失败'); }
  }

  /* ==================== 初始化 ==================== */
  function bindDbUpdates() {
    var db = sdk();
    if (!db || typeof db.onUpdated !== 'function') return;
    var timer = null;
    db.onUpdated(function (payload) {
      var ids = (payload && payload.databaseIds) || [];
      var hit = ids.indexOf(LIB_DB) >= 0 || ids.indexOf(POOL_DB) >= 0 || ids.indexOf(MAIN_DB) >= 0;
      if (!hit) return;
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { reload(); }, 400);
    });
  }

  function init() {
    S.libF.open = {};
    bindShell();
    bindModule1();
    bindModule2();
    bindModule3();
    switchTab('lib');
    bindDbUpdates();
    reload();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* 供冒烟测试使用 */
  window.__BR__ = {
    S: S, reload: reload, renderAll: renderAll, toast: toast, sdk: sdk,
    todayKey: todayKey, shiftKey: shiftKey, dayKey: dayKey, esc: esc,
    timeOf: timeOf, dtText: dtText, toApiDate: toApiDate,
    themeCodeOf: themeCodeOf, themeLabel: themeLabel,
    libFiltered: libFiltered, poolFiltered: poolFiltered,
    libStats: libStats, poolStats: poolStats, monthsOf: monthsOf,
    libStatusOf: libStatusOf, isHistRow: isHistRow, isReviewed: isReviewed,
    mainByPoolId: mainByPoolId, optId: optId, findLib: findLib, findPool: findPool,
    openClaim: openClaim, doClaim: doClaim, setPoolState: setPoolState,
    openClaimBatch: openClaimBatch, doClaimBatch: doClaimBatch,
    writeBackPool: writeBackPool, setClaimMode: setClaimMode,
    renderDropHint: renderDropHint, claimDayLabel: claimDayLabel,
    findDups: findDups, sweepDups: sweepDups, releasePool: releasePool,
    completePool: completePool,
    poolRowById: poolRowById, pickDupKeep: pickDupKeep,
    mainPropsFrom: mainPropsFrom, ruleStat: ruleStat, rulesText: rulesText,
    switchTab: switchTab, doExport: doExport, fileInfoText: fileInfoText,
    openManual: openManual, doManual: doManual, claimAllP0: claimAllP0,
    claimBySource: claimBySource, claimRows: claimRows, poolGroups: poolGroups,
    saveDraft: saveDraft, restoreDraft: restoreDraft, clearDraft: clearDraft
  };
})();
</script>
